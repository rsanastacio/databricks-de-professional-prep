<style>

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{background:var(--bg);color:var(--ink);
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    overscroll-behavior-y:contain;}
  button,select{font-family:inherit;}
  header{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);
    padding:calc(8px + var(--safe-t)) 12px 8px;}
  .top{display:flex;align-items:center;gap:8px;}
  .seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;}
  .seg button{border:0;background:var(--card);color:var(--ink);padding:8px 11px;font-weight:600;font-size:13px;}
  .seg button.on{background:var(--brand);color:#fff;}
  .counter{flex:1;text-align:center;font-weight:700;font-size:15px;}
  .counter small{color:var(--muted);font-weight:400;}
  .iconbtn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px;
    width:40px;height:40px;font-size:18px;line-height:1;cursor:pointer;}
  .bar{height:6px;background:var(--chip);border-radius:99px;overflow:hidden;margin-top:8px;}
  .bar>i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s;}
  #panel{display:none;margin-top:10px;border-top:1px solid var(--line);padding-top:10px;}
  #panel.show{display:block;}
  #panel .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0;font-size:14px;}
  #panel label{display:inline-flex;align-items:center;gap:6px;}
  #panel button,#panel select{border:1px solid var(--line);background:var(--card);color:var(--ink);
    border-radius:8px;padding:9px 12px;font-size:15px;min-height:40px;}
  #panel .danger{color:var(--bad);border-color:var(--bad);}
  #panel .primary{color:#fff;background:var(--brand);border-color:var(--brand);}
  main{padding:14px 12px calc(96px + var(--safe-b));max-width:760px;margin:0 auto;}
  .badge{display:inline-block;font-size:11px;background:var(--chip);color:var(--muted);padding:3px 9px;border-radius:99px;}
  .qnum{font-weight:800;font-size:15px;margin:10px 0 4px;}
  .qtext{white-space:pre-wrap;margin:6px 0 14px;font-size:17px;line-height:1.55;}
  .opt{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);border-radius:12px;
    padding:14px;margin:9px 0;cursor:pointer;min-height:52px;background:var(--card);}
  .opt .lk{font-weight:800;flex:0 0 auto;}
  .opt.sel{border-color:var(--accent);background:rgba(11,92,173,.09);}
  .rev .opt.correct{border-color:var(--ok);background:rgba(26,127,55,.15);}
  .rev .opt.wrong{border-color:var(--bad);background:rgba(207,34,46,.15);}
  .rev .opt.correct .lk::after{content:" ✓";color:var(--ok);}
  .rev .opt.wrong .lk::after{content:" ✗";color:var(--bad);}
  .optnote{font-size:13px;color:var(--muted);margin:-4px 0 10px 16px;padding-left:10px;border-left:2px solid var(--line);}
  .optnote.ok{border-color:var(--ok);}.optnote.bad{border-color:var(--bad);}
  .verdict{display:none;font-weight:700;font-size:14px;margin-top:10px;}
  .rev .verdict{display:block;}
  .verdict.ok{color:var(--ok);}.verdict.bad{color:var(--bad);}
  .expl{display:none;margin-top:10px;padding:12px;border-left:3px solid var(--accent);
    background:var(--chip);border-radius:0 10px 10px 0;font-size:15px;}
  .rev .expl{display:block;}
  code{font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--chip);padding:1px 5px;border-radius:5px;}
  pre.code{margin:0 0 14px;padding:12px;background:var(--chip);border:1px solid var(--line);border-radius:10px;overflow-x:auto;-webkit-overflow-scrolling:touch;}
  pre.code code{padding:0;background:none;white-space:pre;}
  .refs{margin-top:10px;font-size:13px;display:flex;flex-direction:column;gap:4px;}
  .refs a{color:var(--accent);word-break:break-all;}
  blockquote.ev{margin:10px 0 0;padding:8px 10px;border-left:3px solid var(--muted);font-size:13.5px;font-style:italic;color:var(--ink);background:var(--card);border-radius:0 8px 8px 0;}
  nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
    display:flex;gap:10px;padding:10px 12px calc(10px + var(--safe-b));z-index:20;}

    border-radius:12px;min-height:50px;font-weight:700;font-size:16px;cursor:pointer;}
  nav button.primary{background:var(--brand);color:#fff;border-color:var(--brand);}
  nav button:disabled{opacity:.4;}
  #results{display:none;}
  .score{font-size:40px;font-weight:900;text-align:center;margin:8px 0;}
  .score.pass{color:var(--ok);}.score.fail{color:var(--bad);}
  .subs{text-align:center;color:var(--muted);font-size:14px;margin-bottom:14px;}
  table{border-collapse:collapse;width:100%;font-size:14px;}
  th,td{text-align:left;padding:8px 8px;border-bottom:1px solid var(--line);}
  td.n{text-align:right;font-variant-numeric:tabular-nums;}
  .rbtn{flex:1;min-height:48px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;font-weight:700;font-size:15px;}
  .empty{text-align:center;color:var(--muted);padding:60px 16px;}
</style>
</head>

<header>
  <div class="top">
    <div class="seg" id="seg"></div>

    </div>
    <div class="row">
      <button id="jump">Next unanswered</button>
      <button id="finish" class="primary">Finish</button>
      <button id="reset" class="danger">Reset</button>
    </div>
  </div>
</header>

<main id="main">

</main>

    "explanation": "Using dropDuplicatesWithinWatermark() combined with withWatermark() deduplicates only within the watermark window (1 hour), then automatically discards old state—cost-effective and optimal for stateful deduplication. Data older than the watermark window is dropped from state automatically.",

     "C": "Full refresh fails because Kafka offsets are immutable; you must delete the pipeline and recreate it.",
     "D": "Full refresh reprocesses the last N hours of Kafka data (configurable) with the new schema, minimizing data loss."
    },
    "answer": "B",
    "explanation": "A full refresh in a Declarative Pipeline clears the table state and checkpoint, restarting from the current Kafka offset. The new schema is applied prospectively. Historical messages already consumed are not replayed. This is the intended behavior: you lose in-flight state but not necessarily upstream data. Full refresh does not replay Kafka from the beginning; checkpointing ensures offsets are tracked. Offsets are managed by Kafka, not locked to the pipeline. Full refresh does not selectively reprocess recent Kafka messages.",
    "optExpl": {
     "A": "Incorrect: Full refresh does not replay Kafka from the beginning; it clears state and restarts from the current offset.",
     "B": "Correct: Full refresh clears the table and checkpoint; the new schema applies prospectively from the current offset.",
     "C": "Incorrect: Full refresh works without recreating the pipeline; offsets are managed by Kafka, not locked.",
     "D": "Incorrect: Full refresh does not selectively reprocess recent Kafka messages; it starts fresh from the current offset."
    },
    "refs": [
     "https://docs.databricks.com/aws/en/dev-tools/databricks-apps/lakeflow"
    ]
   },
   {
    "id": 58,
    "domain": "Debugging and Deploying",
    "topic": "Git folder branch workflow vs bundle deployment to production",
    "stem": "Your team has two code deployment strategies: (1) Git folders with branch-based workflows (dev -> staging -> main in Git, synced to Databricks), and (2) Declarative Automation Bundles deployed via `databricks bundle deploy` to workspaces. You need code review, rollback capability, and quick rollforward. Which is more suitable?",
    "code": null,
    "options": {
     "A": "Git folders: branch-based code review in Git is familiar, and rollback is straightforward via Git history revert.",
     "B": "Bundles: deployment state is versioned and bundled; rollback is a `databricks bundle deploy` of a prior version.",
     "C": "Git folders are simpler for code review; bundles add complexity without extra safety.",
     "D": "Choose based on team preference; they provide equivalent operational safety for production deployments."
    },
    "answer": "B",
    "explanation": "Bundles are better for production deployments requiring rollback. Each bundle deployment is self-contained with versioning; you can rollback by deploying a prior bundle version. Git folders require Git history manipulation for rollback, which is more complex. Bundles also support state isolation (dev vs prod via workspace targets). Git branch reviews are familiar but complicate rollback via history rewrites. Bundles provide production-grade rollback and workspace isolation, not just complexity. Bundles offer significantly better operational safety than equivalent Git workflows.",
    "optExpl": {
     "A": "Incorrect: While Git review is familiar, rolling back via Git history revert is complex and risks other branches.",
     "B": "Correct: Bundles version deployments; rollback is a simple re-deployment of a prior version.",
     "C": "Incorrect: Bundles provide production-grade rollback and workspace isolation; these are not complexity, but safety.",
     "D": "Incorrect: Bundles offer better operational safety and rollback; this is a architectural choice, not preference."
    },
    "refs": [
     "https://docs.databricks.com/aws/en/dev-tools/bundles/jobs-tutorial"
    ]
   },
   {
    "id": 59,
    "domain": "Data Modeling",
    "topic": "Unity Catalog metric view definition (measures, dimensions, source)",
    "stem": "Your BI team is building a semantic layer for analytics using metric views in Unity Catalog. You define a metric view over a fact table with columns `date`, `user_id`, `revenue`, `units_sold`. The view aggregates revenue and units by date and user. Which role does each column play: measures, dimensions, or source?",
    "code": {
     "lang": "sql",
     "src": "CREATE METRIC my_schema.daily_revenue\nAS (\n  SELECT date, user_id, SUM(revenue) as total_revenue, SUM(units_sold) as total_units\n  FROM my_table\n  GROUP BY date, user_id\n);\nALTER METRIC my_schema.daily_revenue\nSET MEASURES = [total_revenue, total_units]\nSET DIMENSIONS = [date, user_id];"
    },
    "options": {
     "A": "Measures: `total_revenue`, `total_units` (aggregates). Dimensions: `date`, `user_id` (grouping columns). Source: `my_table`.",
     "B": "Measures: `date`, `user_id` (identifiers). Dimensions: `total_revenue`, `total_units` (aggregates).",
     "C": "All columns are measures; dimensions are automatically inferred from GROUP BY and do not need explicit definition.",
     "D": "Metric views treat all columns equally; measures and dimensions are not distinguished in the definition."
    },
    "answer": "A",
    "explanation": "Metric views define semantic roles for columns to enable BI tools to understand aggregation. Measures are aggregated numeric columns (`total_revenue`, `total_units`). Dimensions are grouping/filtering columns (`date`, `user_id`). The source is the underlying table (`my_table`). This structure lets BI tools auto-aggregate and drill down correctly.",
    "optExpl": {
     "A": "Correct: Measures are aggregated values; dimensions are grouping columns; source is the base table.",
     "B": "Incorrect: Identifiers are dimensions; aggregated values are measures; you have reversed them.",
     "C": "Incorrect: Metric views require explicit definition of measures and dimensions for semantic clarity.",
     "D": "Incorrect: Metric views explicitly distinguish measures and dimensions for BI consumption."
    },
    "refs": [
     "https://docs.databricks.com/aws/en/uc-semantics/metric-views/create"
    ]
   },
   {
    "id": 60,
    "domain": "Data Modeling",
    "topic": "Star schema served through materialized views with clustering on fact table",
    "stem": "You have a star schema with a `dim_products` dimension and a `fact_sales` fact table (1 billion rows). You create a materialized view that joins the two and filters by `fact_sales.country = 'US'`. You apply Liquid Clustering to `fact_sales` on `(country, product_id)`. When the materialized view queries the fact table, is the clustering key used to speed up the filter?",
    "code": null,
    "options": {
     "A": "Yes, the clustering on `(country, product_id)` is used during the materialized view query to prune data blocks where `country != 'US'`.",
     "B": "No, clustering is only used for table scans directly from the fact table; materialized views bypass clustering optimization.",
     "C": "Yes, but only if the materialized view explicitly references the clustering columns in the SELECT list.",
     "D": "No, clustering only helps with range queries (`WHERE col BETWEEN`); equality filters like `country='US'` are not optimized by clustering."
    },
    "answer": "A",
    "explanation": "Liquid Clustering applies to all queries on the table, including those from materialized views. When the materialized view filters `country='US'`, Databricks uses the clustering on `country` to prune data blocks, avoiding a full table scan. Clustering is not limited to direct table scans; it applies to all queries. Clustering columns must appear in the WHERE clause for filtering, not in SELECT. Clustering optimizes equality filters and range queries; it is perfect for this scenario.",
    "optExpl": {
     "A": "Correct: Liquid Clustering on `country` enables block pruning for the materialized view filter, speeding up the query.",
     "B": "Incorrect: Clustering applies to all queries on the table, including materialized views.",
     "C": "Incorrect: Clustering columns must appear in the WHERE clause, not SELECT; they optimize filters, not projections.",
     "D": "Incorrect: Clustering optimizes equality filters and range queries; `country='US'` is a perfect use case."
    },
    "refs": [
     "https://docs.databricks.com/aws/en/tables/clustering"
    ]
   }
  ]
 }
};
</script>
<script>
(function(){
"use strict";
var DATA=window.SIMULADOS||null;
var LS={g:function(k){try{return JSON.parse(localStorage.getItem(k));}catch(e){return null;}},
        s:function(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}},
        d:function(k){try{localStorage.removeItem(k);}catch(e){}}};
var $=function(id){return document.getElementById(id);};
var PASS=0.70;
if(!DATA){$("q").innerHTML='<div class="empty">Data not found.</div>';return;}

var sid=LS.g("depro_current"); if(!DATA[sid]) sid=Object.keys(DATA)[0];
var study=LS.g("depro_study"); if(study===null) study=true;
var idx=0, wrongOnly=false;

var theme=LS.g("depro_theme")||"auto"; applyTheme(theme); $("theme").value=theme;
$("theme").onchange=function(){theme=this.value;LS.s("depro_theme",theme);applyTheme(theme);};
function applyTheme(t){if(t==="auto")document.documentElement.removeAttribute("data-theme");else document.documentElement.setAttribute("data-theme",t);}

$("study").checked=study;
$("study").onchange=function(){study=this.checked;LS.s("depro_study",study);renderQ();};
$("menu").onclick=function(){$("panel").classList.toggle("show");};

function kA(){return "depro_ans_"+sid;} function kS(){return "depro_sub_"+sid;}
function kT(){return "depro_timer_"+sid;} function kI(){return "depro_idx_"+sid;}
function ans(){return LS.g(kA())||{};}
function setAns(a){LS.s(kA(),a);}
function submitted(){return !!LS.g(kS());}
function qs(){return DATA[sid].questions;}
function reveal(q,a){return submitted()||(study&&!!a[q.id]);}

function buildSeg(){
  var s=$("seg");s.innerHTML="";
  Object.keys(DATA).forEach(function(k,i){
    var b=document.createElement("button");
    b.textContent="Exam "+(i+1);
    b.className=k===sid?"on":"";
    b.onclick=function(){sid=k;LS.s("depro_current",sid);idx=LS.g(kI())||0;wrongOnly=false;render();};
    s.appendChild(b);
  });
}

function workList(){
  var a=ans();
  if(wrongOnly&&submitted()) return qs().filter(function(q){return a[q.id]!==q.answer;});
  return qs();
}

function renderQ(){
  $("results").style.display="none";
  $("q").style.display="block";
  var list=workList(); if(list.length===0){list=qs();wrongOnly=false;}
  if(idx>=list.length) idx=list.length-1; if(idx<0) idx=0;
  var q=list[idx], a=ans(), rev=reveal(q,a);
  var box=$("q"); box.className=rev?"rev":"";
  var dom=(q.domain||"")+(q.topic?" — "+q.topic:"");
  var h='<span class="badge">'+esc(dom)+'</span><div class="qnum">Question '+q.id+'</div>';
  h+='<div class="qtext">'+fmt(q.stem||q.text)+'</div>';
  if(q.code&&q.code.src) h+='<pre class="code"><code>'+esc(q.code.src)+'</code></pre>';
  ["A","B","C","D"].forEach(function(L){
    if(q.options[L]==null)return;
    var sel=a[q.id]===L, cls="opt"+(sel?" sel":"");
    if(rev){if(L===q.answer)cls+=" correct";else if(sel)cls+=" wrong";}
    h+='<div class="'+cls+'" data-l="'+L+'"><span class="lk">'+L+')</span><span>'+fmt(q.options[L])+'</span></div>';
    if(rev && q.optExpl && q.optExpl[L]) h+='<div class="optnote '+(L===q.answer?"ok":"bad")+'">'+fmt(q.optExpl[L])+'</div>';
  });
  var chosen=a[q.id], correct=chosen===q.answer;
  h+='<div class="verdict '+(correct?"ok":"bad")+'">'+(!chosen?"":(correct?"✓ Correct ("+q.answer+")":"✗ You chose "+chosen+" — correct answer is "+q.answer))+'</div>';
  if(q.explanation){
    var refs=(q.refs||[]).map(function(u){return '<a href="'+esc(u)+'" target="_blank" rel="noopener">'+esc(u.replace(/^https:\/\/docs\.databricks\.com\/(aws\/en\/)?/,""))+'</a>';}).join("");
    var ev=(q.evidence&&q.evidence.quote)?'<blockquote class="ev">From the docs: “'+esc(q.evidence.quote)+'”</blockquote>':'';
    h+='<div class="expl"><b>Why:</b> '+fmt(q.explanation)+ev+(refs?'<div class="refs"><b>Docs:</b>'+refs+'</div>':'')+'</div>';
  }
  box.innerHTML=h;
  box.querySelectorAll(".opt").forEach(function(o){
    o.onclick=function(){
      if(submitted())return;
      var aa=ans();aa[q.id]=this.getAttribute("data-l");setAns(aa);
      renderQ();
    };
  });
  updateNav(list); updateBars();
}

function updateNav(list){
  $("prev").disabled=idx<=0;
  $("next").textContent=idx>=list.length-1?"Finish ✓":"Next ▶";
}

function updateBars(){
  var a=ans(),n=qs().filter(function(q){return a[q.id];}).length,t=qs().length;
  $("counter").innerHTML=(idx+1)+"<small>/"+workList().length+"</small>";
  $("prog").style.width=(100*n/t)+"%";
}

$("prev").onclick=function(){if(idx>0){idx--;LS.s(kI(),idx);renderQ();window.scrollTo(0,0);}};
$("next").onclick=function(){
  var list=workList();
  if(idx>=list.length-1){ if(!submitted()) doFinish(); else showResults(); return; }
  idx++;LS.s(kI(),idx);renderQ();window.scrollTo(0,0);
};
$("jump").onclick=function(){
  var a=ans(),list=qs();
  for(var i=0;i<list.length;i++){if(!a[list[i].id]){idx=i;LS.s(kI(),idx);wrongOnly=false;$("panel").classList.remove("show");renderQ();window.scrollTo(0,0);return;}}
  alert("All questions answered ✓");
};
$("finish").onclick=doFinish;
$("reset").onclick=function(){
  if(!confirm("Reset answers, grading and timer for this exam?"))return;
  LS.d(kA());LS.d(kS());LS.d(kT());LS.d(kI());idx=0;wrongOnly=false;$("panel").classList.remove("show");render();
};

function doFinish(){
  var a=ans(),miss=qs().filter(function(q){return !a[q.id];}).length;
  if(!confirm(miss?(miss+" unanswered. Finish anyway?"):"Finish and see results?"))return;
  LS.s(kS(),true);$("panel").classList.remove("show");showResults();
}

function showResults(){
  $("q").style.display="none";
  var r=$("results");r.style.display="block";
  var a=ans(),list=qs();
  var correct=list.filter(function(q){return a[q.id]===q.answer;}).length;
  var pct=correct/list.length,pass=pct>=PASS;
  var dom={};list.forEach(function(q){var d=q.domain||"?";dom[d]=dom[d]||{t:0,c:0};dom[d].t++;if(a[q.id]===q.answer)dom[d].c++;});
  var rows=Object.keys(dom).sort().map(function(d){var o=dom[d];return '<tr><td>'+esc(d)+'</td><td class="n">'+o.c+'/'+o.t+'</td><td class="n">'+Math.round(100*o.c/o.t)+'%</td></tr>';}).join("");
  r.innerHTML='<div class="score '+(pass?"pass":"fail")+'">'+Math.round(pct*100)+'%</div>'
    +'<div class="subs">'+correct+'/'+list.length+' · pass mark ~70% · '+(pass?"above the pass mark 🎯":"below — review the incorrect ones")+'</div>'
    +'<table><thead><tr><th>Domain</th><th class="n">Correct</th><th class="n">%</th></tr></thead><tbody>'+rows+'</tbody></table>'
    +'<div style="display:flex;gap:10px;margin-top:16px">'
    +'<button id="revWrong" class="rbtn">Review incorrect</button>'
    +'<button id="allQ" class="rbtn">Show all</button></div>';
  $("counter").textContent="Results";
  $("revWrong").onclick=function(){
    if(!list.some(function(q){return a[q.id]!==q.answer;})){alert("No incorrect answers 🎯");return;}
    wrongOnly=true;idx=0;renderQ();window.scrollTo(0,0);
  };
  $("allQ").onclick=function(){wrongOnly=false;idx=0;renderQ();window.scrollTo(0,0);};
}

var ti=null;
function timer(){
  clearInterval(ti);
  if(submitted()){$("timer").textContent="—";return;}
  var st=LS.g(kT());if(!st){st=Date.now();LS.s(kT(),st);}
  function tick(){var left=120*60-Math.floor((Date.now()-st)/1000);if(left<=0){left=0;clearInterval(ti);}
    var m=Math.floor(left/60),s=left%60;$("timer").textContent=(m<10?"0":"")+m+":"+(s<10?"0":"")+s;}
  tick();ti=setInterval(tick,1000);
}

function render(){buildSeg();if(submitted())showResults();else renderQ();timer();}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function fmt(s){return esc(s).replace(/`([^`]+)`/g,"<code>$1</code>");}

idx=LS.g(kI())||0;
render();

if("serviceWorker" in navigator && location.protocol==="https:"){navigator.serviceWorker.register("sw.js");}
})();
</script>
</body>
</html>
